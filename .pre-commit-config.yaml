repos:
  - repo: 'https://github.com/pre-commit/pre-commit-hooks'
    rev: 'v6.0.0'
    hooks:
      - id: 'check-added-large-files'
      - id: 'check-merge-conflict'
      - id: 'end-of-file-fixer'
      - id: 'trailing-whitespace'

  # The theme is a single LESS file that Icinga Web compiles together with its
  # own and every module's LESS. A parse error there does not just break the
  # theme, it takes the whole stylesheet down, so make sure it compiles.
  - repo: 'local'
    hooks:
      - id: 'lessc'
        name: 'lessc'
        entry: 'lessc --lint'
        language: 'node'
        additional_dependencies:
          - 'less@4.9.0'
        files: '\.less$'
